name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/verification
      DIDIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate migration rendering
        run: python -m alembic upgrade --sql head > /dev/null
      - name: Run non-live tests
        run: python -m pytest -m "not integration" -q
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    name: Frontend lint, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_DIST_DIR: .next-ci
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
